name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  prepare-node-matrix:
    name: Prepare Node matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: matrix
        run: node scripts/ci-node-matrix.js

  test-ci:
    name: test / ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: prepare-node-matrix
    env:
      GIT_AUTHOR_NAME: sennel CI
      GIT_AUTHOR_EMAIL: sennel-ci@example.invalid
      GIT_COMMITTER_NAME: sennel CI
      GIT_COMMITTER_EMAIL: sennel-ci@example.invalid
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-node-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: ${{ matrix.lane == 'current-lts' }}
      - name: Prepare volume acceptance workspace
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const directory = fs.mkdtempSync("/dev/shm/sennel-ci-");
            fs.chmodSync(directory, 0o700);
            fs.appendFileSync(process.env.GITHUB_ENV, `SENNEL_TEST_SECOND_VOLUME_ROOT=${directory}\n`);
          '
      - run: npm test

  required:
    name: Required CI
    runs-on: ubuntu-latest
    needs: [prepare-node-matrix, test-ci]
    if: always()
    steps:
      - name: Verify Node matrix
        env:
          MATRIX_RESULT: ${{ needs.test-ci.result }}
        run: test "$MATRIX_RESULT" = "success"
