name: Prepare phase acceptance

on:
  push:
    branches: [codex/f72f, flow-phase/01-impl]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flow-phase-checker:
    name: flow-phase-checker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18.19.0"
      - name: Create evidence directory
        run: mkdir -p .tmp/f72f
      - name: Verify shared checker contracts
        run: >-
          node --test
          tests/structure/staged-scope-contract.test.js
          tests/structure/external-execution-contract.test.js
          tests/structure/service-contract.test.js
          tests/structure/step-execution-contract.test.js
          tests/structure/execution-routing.test.js
          tests/structure/execution-routing-provenance.test.js
          tests/structure/constructor-invariant-contract.test.js
          tests/integration/structure-production-contract.test.js
          tests/integration/structure-registration-source.test.js
          tests/integration/structure-phase-manifest.test.js
          tests/integration/structure-checker.test.js
          tests/unit/structure-rules.test.js
          > .tmp/f72f/shared-checker.log 2>&1
      - name: Preserve shared checker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f72f-shared-checker-evidence
          path: .tmp/f72f/shared-checker.log
          if-no-files-found: error

  flow-phase-acceptance:
    name: flow-phase-acceptance
    needs: flow-phase-checker
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GIT_AUTHOR_NAME: sennel CI
      GIT_AUTHOR_EMAIL: sennel-ci@example.invalid
      GIT_COMMITTER_NAME: sennel CI
      GIT_COMMITTER_EMAIL: sennel-ci@example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18.19.0"
      - name: Create evidence directory
        run: mkdir -p .tmp/f72f
      - name: Verify related and settlement regression contracts
        run: >-
          node --test
          tests/integration/flow/issue-snapshot-source.test.js
          tests/integration/flow-cli/worktree-flow-binding.test.js
          tests/integration/flow-cli/commands/post-worktree-hook.test.js
          tests/integration/flow/current-flow-state-foundation.test.js
          tests/integration/flow/draft-step-result-settlement.test.js
          > .tmp/f72f/related-regression.log 2>&1
      - name: Verify fixed preparation structure scope
        if: always()
        run: >-
          node --test
          tests/structure/draft.test.js
          tests/structure/spec.test.js
          tests/structure/prepare.test.js
          > .tmp/f72f/phase-structure.log 2>&1
      - name: Verify preparation and downstream scenarios
        if: always()
        run: >-
          node --test
          tests/integration/flow/prepare-execution-observer.test.js
          tests/integration/flow/prepare-service-boundary-coverage.test.js
          tests/integration/flow-cli/prepare-artifact-scenario.test.js
          tests/integration/flow-cli/prepare-worktree-branch-resume.test.js
          tests/integration/flow-cli/draft-artifact-scenario.test.js
          tests/integration/flow-cli/spec-artifact-scenario.test.js
          > .tmp/f72f/phase-scenarios.log 2>&1
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f72f-prepare-acceptance-evidence
          path: .tmp/f72f/*.log
          if-no-files-found: error
